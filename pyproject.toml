[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "s2g"
version = "0.4.0"
description = "Local Sony A7C II RAW editor with experimental GR-inspired color styles"
requires-python = ">=3.12"
dependencies = ["rawpy>=0.27,<0.28", "numpy>=2,<3", "tifffile>=2025.1", "Pillow>=11,<13"]

[project.scripts]
s2g = "s2g.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
s2g = ["resources/*.json", "resources/web/*"]
